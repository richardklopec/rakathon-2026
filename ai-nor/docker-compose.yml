services:
  iris:
    container_name: ai-nor-iris
    build: ./infra/iris
    ports:
      - "1972:1972"     # SQL / native API
      - "52773:52773"   # web: FHIR REST, Management Portal
      - "2575:2575"     # HL7v2 MLLP from the NIS (production AINOR.Production)
    environment:
      ISC_DATA_DIRECTORY: /durable
    volumes:
      - iris-data:/durable

volumes:
  iris-data:
